server:
  port: ${BACKEND_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: notesindia-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notesindia}
    username: ${DB_USERNAME:notesindia}
    password: ${DB_PASSWORD:notesindia_dev_password_change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/notesindia}}
    user: ${DB_USERNAME:notesindia}
    password: ${DB_PASSWORD:notesindia_dev_password_change_me}
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  cache:
    type: ${CACHE_TYPE:redis}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE_MB:50}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:50}MB

notesindia:
  jwt:
    secret: ${JWT_SECRET:NotesIndiaDefaultDevSecretKeyForJwtSigning256BitMinimumLength2026!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./storage/uploads}
    max-file-size-bytes: 52428800
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:notesindia-files}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin_change_me}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:CHANGE_ME_INTERNAL_AI_SERVICE_SECRET_KEY_NOTESINDIA}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:180}
  rate-limit:
    api-requests-per-minute: 120
    ai-requests-per-minute: 25
    upload-requests-per-minute: 15
  seed-demo-data: ${SEED_DEMO_DATA:true}

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
